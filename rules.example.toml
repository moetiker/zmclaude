# Reply rules for zmclaude. Copy to ~/.config/zmclaude/rules.toml.
# The first rule whose match fits wins.
#
# match keys (all optional, all given keys must fit):
#   to          = addresses the mail was sent to (To or Cc)
#   from        = sender addresses
#   from_domain = sender domains
#   subject     = regular expression on the subject
#
# Sender address, signature and logo come from the Zimbra identities (see
# identities.json, refreshed by "zmclaude sync"), not from this file.
# A rule may still name an identity to override the automatic choice.
#
# Other keys describe how to answer:
#   language, address ("Sie", "du" or "auto": as the incoming mail),
#   greeting, closing, reply_all, cc, facts (fixed information that may be
#   used in replies), notes (hints for writing the reply)

[[rule]]
name = "Course registration"
match.to = ["courses@example.org"]
language = "en"
address = "auto"
greeting = "Dear {name}"
closing = "Kind regards\nJane Doe"
facts = [
  "Course dates and sign-up: https://courses.example.org",
  "Fee: EUR 250 per day, lunch included",
]
notes = [
  "Registration happens only through the sign-up form.",
]

[[rule]]
name = "Invoices"
match.subject = '(?i)\b(invoice|rechnung)\b'
language = "de"
address = "Sie"
closing = "Freundliche Grüsse\nJane Doe"
notes = [
  "Questions about an amount go to accounting@example.org in Cc.",
]

[[rule]]
name = "Customer with fixed Cc"
match.from_domain = ["customer.example.com"]
reply_all = true

[[rule]]
name = "Default"
language = "auto"
address = "auto"
closing = "Regards\nJane"
