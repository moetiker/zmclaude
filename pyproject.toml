[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "zmclaude"
version = "0.1.0"
description = "Find mails in a Zimbra mailbox, read them and save reply drafts"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
zmclaude = "zmclaude:main"

# The script stays a single file without extension so that ./zmclaude runs
# from a checkout; the wheel ships it as an importable module.
[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.force-include]
"zmclaude" = "zmclaude.py"

[tool.hatch.build.targets.sdist]
include = ["zmclaude", "README.md", "LICENSE", "docs/manual.md"]

# ruff only picks up *.py files by itself
[tool.ruff]
extend-include = ["zmclaude"]

[tool.pytest.ini_options]
testpaths = ["tests"]
